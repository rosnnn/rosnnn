<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Outfit:wght@400;600;900&amp;display=swap');
      
      svg {
        background-color: #06050C;
        font-family: 'Fira Code', monospace;
      }
      
      /* Glowing Glow Filters */
      .glow-nebula {
        filter: url(#nebula-blur);
        opacity: 0.35;
      }
      .glow-cyan {
        filter: drop-shadow(0 0 6px #00F0FF);
      }
      .glow-red {
        filter: drop-shadow(0 0 6px #FF3B30);
      }
      .glow-white {
        filter: drop-shadow(0 0 8px #FFFFFF);
      }
      
      /* --- ANIMATIONS --- */
      
      /* Nebula Galaxy Slow Rotation */
      @keyframes spin-galaxy {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .galaxy-swirl {
        transform-origin: 350px 225px;
        animation: spin-galaxy 120s linear infinite;
      }
      
      /* Moon & Spidey Gentle Floating */
      @keyframes float-moon {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(0.5deg); }
      }
      .moon-system {
        transform-origin: 480px 220px;
        animation: float-moon 8s ease-in-out infinite;
      }
      
      /* Stars Blinking */
      @keyframes star-blink {
        0%, 100% { opacity: 0.15; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .star {
        fill: #FFFFFF;
        transform-box: fill-box;
        transform-origin: center;
        animation: star-blink 3s infinite alternate;
      }
      .st-d1 { animation-delay: 0s; }
      .st-d2 { animation-delay: 1s; }
      .st-d3 { animation-delay: 2s; }
      .st-d4 { animation-delay: 1.5s; }
      
      /* Web Grid Pulsing */
      @keyframes web-flow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      .web-mesh-pulse {
        stroke-dasharray: 20 40;
        animation: web-flow 4s linear infinite;
      }
      .web-mesh-pulse-reverse {
        stroke-dasharray: 15 45;
        animation: web-flow 6s linear reverse infinite;
      }
      
      /* Spidey Suit Circuit Glow Pulse */
      @keyframes suit-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .suit-glow-r {
        stroke: #FF3B30;
        animation: suit-pulse 2s ease-in-out infinite;
      }
      .suit-glow-b {
        stroke: #0070F3;
        animation: suit-pulse 2s ease-in-out infinite;
        animation-delay: 1s;
      }
      
      /* Glitch Diagnostic Text */
      @keyframes text-glitch {
        0%, 100% { transform: translate(0); text-shadow: none; }
        93% { transform: translate(1px, -0.5px); text-shadow: -1px 0 #FF3B30, 1px 0 #00F0FF; }
        95% { transform: translate(-1px, 0.5px); text-shadow: 1px 0 #FF3B30, -1px 0 #00F0FF; }
        97% { transform: translate(0); }
      }
      .glitch {
        animation: text-glitch 6s step-end infinite;
      }
    </style>

    <!-- Deep Nebula Blur Filter -->
    <filter id="nebula-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="60%" stop-color="#FFEEAD" />
      <stop offset="100%" stop-color="#E2D497" />
    </linearGradient>
    
    <linearGradient id="spidey-suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A21" />
      <stop offset="100%" stop-color="#07030C" />
    </linearGradient>
  </defs>

  <!-- ==================== BACKGROUND: SWIRLING GALAXY NEBULA ==================== -->
  <g class="galaxy-swirl">
    <!-- Cosmic Dust Gas Layers -->
    <ellipse cx="250" cy="180" rx="180" ry="90" fill="#FF007F" transform="rotate(-25 250 180)" class="glow-nebula" />
    <ellipse cx="420" cy="270" rx="200" ry="100" fill="#00F0FF" transform="rotate(-25 420 270)" class="glow-nebula" />
    <ellipse cx="320" cy="220" rx="160" ry="70" fill="#7928CA" transform="rotate(-15 320 220)" class="glow-nebula" />
  </g>

  <!-- ==================== BACKGROUND: BLINKING STARS ==================== -->
  <g>
    <circle cx="80" cy="90" r="1.5" class="star st-d1" />
    <circle cx="150" cy="60" r="1" class="star st-d3" />
    <circle cx="270" cy="70" r="2" class="star st-d2" />
    <circle cx="340" cy="100" r="1.5" class="star st-d4" />
    <circle cx="100" cy="280" r="1" class="star st-d2" />
    <circle cx="190" cy="350" r="2" class="star st-d1" />
    <circle cx="50" cy="180" r="1.5" class="star st-d3" />
    <circle cx="620" cy="80" r="2" class="star st-d1" />
    <circle cx="650" cy="320" r="1.2" class="star st-d4" />
    <circle cx="550" cy="370" r="1.5" class="star st-d2" />
    <circle cx="380" cy="380" r="1" class="star st-d3" />
  </g>

  <!-- ==================== CONSTELLATION SPIDER-WEB GRID ==================== -->
  <!-- Star Nodes of the Web (Blinking) -->
  <circle id="node-center" cx="290" cy="160" r="3" class="star st-d1 glow-white" />
  <circle id="node-top-l" cx="190" cy="80" r="2.5" class="star st-d3 glow-white" />
  <circle id="node-top-r" cx="350" cy="70" r="2.5" class="star st-d2 glow-white" />
  <circle id="node-mid-l" cx="110" cy="150" r="2.5" class="star st-d4 glow-white" />
  <circle id="node-bot-l" cx="130" cy="260" r="3" class="star st-d1 glow-white" />
  <circle id="node-bot-m" cx="230" cy="310" r="2.5" class="star st-d3 glow-white" />
  <circle id="node-bot-r" cx="330" cy="270" r="2.5" class="star st-d2 glow-white" />

  <g stroke="#00F0FF" stroke-width="0.8" opacity="0.6">
    <!-- Connecting outer boundary web lines -->
    <line x1="190" y1="80" x2="350" y2="70" class="glow-cyan" />
    <line x1="350" y1="70" x2="330" y2="270" class="glow-cyan" />
    <line x1="330" y1="270" x2="230" y2="310" class="glow-cyan" />
    <line x1="230" y1="310" x2="130" y2="260" class="glow-cyan" />
    <line x1="130" y1="260" x2="110" y2="150" class="glow-cyan" />
    <line x1="110" y1="150" x2="190" y2="80" class="glow-cyan" />
    
    <!-- Outer boundary pulse effects -->
    <line x1="190" y1="80" x2="350" y2="70" class="web-mesh-pulse" />
    <line x1="350" y1="70" x2="330" y2="270" class="web-mesh-pulse-reverse" />
    <line x1="330" y1="270" x2="230" y2="310" class="web-mesh-pulse" />
    <line x1="230" y1="310" x2="130" y2="260" class="web-mesh-pulse-reverse" />
    <line x1="130" y1="260" x2="110" y2="150" class="web-mesh-pulse" />
    
    <!-- Radiating web lines to center node -->
    <line x1="190" y1="80" x2="290" y2="160" class="glow-cyan" />
    <line x1="350" y1="70" x2="290" y2="160" class="glow-cyan" />
    <line x1="330" y1="270" x2="290" y2="160" class="glow-cyan" />
    <line x1="230" y1="310" x2="290" y2="160" class="glow-cyan" />
    <line x1="130" y1="260" x2="290" y2="160" class="glow-cyan" />
    <line x1="110" y1="150" x2="290" y2="160" class="glow-cyan" />
    
    <!-- Radiating pulse lines -->
    <line x1="190" y1="80" x2="290" y2="160" class="web-mesh-pulse" />
    <line x1="330" y1="270" x2="290" y2="160" class="web-mesh-pulse-reverse" />
    <line x1="130" y1="260" x2="290" y2="160" class="web-mesh-pulse" />
    
    <!-- Concentric inner spider-web lines -->
    <path d="M 240,120 Q 290,115 320,115 Q 310,210 310,215 Q 260,230 260,230 Q 210,210 210,205 Q 200,160 240,120 Z" fill="none" class="glow-cyan" />
    <path d="M 240,120 Q 290,115 320,115 Q 310,210 310,215 Q 260,230 260,230 Q 210,210 210,205 Q 200,160 240,120 Z" fill="none" class="web-mesh-pulse" />
    
    <path d="M 265,140 Q 290,137 305,137 Q 300,185 300,187 Q 275,195 275,195 Q 250,185 250,182 Q 245,160 265,140 Z" fill="none" class="glow-cyan" opacity="0.8" />
  </g>

  <!-- ==================== MOON AND SPIDER-MAN SYSTEM ==================== -->
  <g class="moon-system">
    
    <!-- THE GLOWING CRESCENT MOON -->
    <g>
      <!-- Crescent shape -->
      <path d="M 540,110 C 470,110 410,170 410,240 C 410,310 470,370 540,370 C 500,350 475,310 475,240 C 475,170 500,130 540,110 Z" fill="url(#moon-grad)" filter="drop-shadow(0 0 20px rgba(255, 253, 240, 0.45))" />
      
      <!-- Crater Details (Soft overlay circles) -->
      <circle cx="455" cy="200" r="14" fill="#D6C58B" opacity="0.18" />
      <circle cx="465" cy="290" r="12" fill="#D6C58B" opacity="0.18" />
      <circle cx="435" cy="250" r="8" fill="#D6C58B" opacity="0.15" />
      <circle cx="440" cy="215" r="5" fill="#D6C58B" opacity="0.15" />
    </g>

    <!-- SPIDER-MAN SILHOUETTE & NEON SUIT PATHWAYS -->
    <!-- Positioned sitting on the crescent at X=450, Y=240 -->
    <g transform="translate(0, 0)">
      
      <!-- Web string shot from wrist to center node -->
      <!-- wrist is roughly at X=425, Y=222 -->
      <line x1="424" y1="221" x2="290" y2="160" stroke="#00F0FF" stroke-width="1.8" class="glow-cyan" />
      <line x1="424" y1="221" x2="290" y2="160" stroke="#FFFFFF" stroke-width="2" class="web-mesh-pulse" />
      
      <!-- Spidey Dark Chassis Body Shape -->
      <!-- Low poly geometric stylized silhouette -->
      <path d="
        M 436,193 
        C 434,180 448,180 446,193 
        C 445,200 439,202 436,193 Z 
        M 434,198 
        L 421,210 L 413,222 L 424,223 
        L 435,214 L 439,201 Z 
        M 439,201 
        Q 444,215 448,235 
        L 462,238 L 472,216 L 479,219 L 468,244 
        L 450,242 L 442,218 Z
        M 448,235
        Q 444,250 440,268
        L 418,252 L 398,242 L 394,248 L 416,260 
        L 438,276 L 445,274 L 448,237 Z
        M 440,268
        L 448,295 L 452,310 H 459 L 454,293 
        L 446,270 Z
      " fill="url(#spidey-suit-grad)" stroke="#110921" stroke-width="1.5" />

      <!-- Glowing Suit Patterns (Red Web & Blue Accents) -->
      <!-- Blue Leg and Back Highlights -->
      <path d="M 444,215 Q 448,230 450,240" fill="none" stroke-width="1.2" class="suit-glow-b" />
      <path d="M 440,268 L 448,295 L 452,310" fill="none" stroke-width="1.5" class="suit-glow-b" />
      <path d="M 418,252 L 398,242" fill="none" stroke-width="1.2" class="suit-glow-b" />
      
      <!-- Red Head, Chest and Arm Highlights -->
      <path d="M 441,185 C 438,190 442,196 441,200" fill="none" stroke-width="1.2" class="suit-glow-r" />
      <path d="M 434,198 L 421,210 L 413,222" fill="none" stroke-width="1.2" class="suit-glow-r" />
      <path d="M 448,216 L 468,244" fill="none" stroke-width="1.2" class="suit-glow-r" />
      <path d="M 439,201 Q 444,215 448,235" fill="none" stroke-width="1.5" class="suit-glow-r" />
      
      <!-- Spidey Glowing White Mask Eyes -->
      <polygon points="426,189 432,192 433,188" fill="#FFFFFF" class="glow-white" />
      <polygon points="436,189 441,192 440,188" fill="#FFFFFF" class="glow-white" />
    </g>
  </g>

  <!-- ==================== HUD FOREGROUND & TELEMETRY PANELS ==================== -->
  
  <!-- Left Side: CV Personal Details & Stack Diagnostic -->
  <g fill="#00F0FF" font-family="'Fira Code', monospace" font-size="8.5" opacity="0.85" class="glow-cyan">
    <!-- glitch text -->
    <text x="35" y="45" class="glitch" font-weight="700">ROSHAN_KUMAR_JHA // SYSTEMS_ACTIVE</text>
    <text x="35" y="60">ROLE_MODULE // FULL_STACK_ENGINEER</text>
    <text x="35" y="72">LOC.SIGNAL  // BENGALURU_INDIA</text>
    <rect x="35" y="80" width="80" height="1.5" fill="#00F0FF" />
    
    <!-- Skills Dashboard telemetry -->
    <text x="35" y="365">LANGUAGES_CORE // JS.TS.PYTHON.JAVA.DART</text>
    <text x="35" y="377">FRAMEWORKS_UX  // REACT.NEXT.FLUTTER.NODE</text>
    <text x="35" y="389">DATABASE_GRID  // POSTGRES.MONGO.REDIS</text>
    <text x="35" y="401">AI_DEV_PILOT   // ANTIGRAVITY.CURSOR.CLAUDE</text>
  </g>

  <!-- Right Side: Spidey Stark Suit Telemetry -->
  <g fill="#FF3B30" font-family="'Fira Code', monospace" font-size="8.5" text-anchor="end" opacity="0.85" class="glow-red">
    <text x="665" y="45" class="glitch" font-weight="700">STARK_COSMIC_SUIT_V4</text>
    <text x="665" y="60">WEB_GRID_DENSITY // 8_STAR_NODES</text>
    <text x="665" y="72">COGNITION_LINK  // ON_LINE</text>
    <rect x="585" y="80" width="80" height="1.5" fill="#FF3B30" />
    
    <!-- Suit diagnostics -->
    <text x="665" y="365">TENSION_LOAD // 14.2 KN</text>
    <text x="665" y="377">ATMOS_SHIELD // STABLE</text>
    <text x="665" y="389">NEBULA_TEMP  // -270 C</text>
    <text x="665" y="401">MISSION_VAL  // CODE_OR_BUUST</text>
  </g>

  <!-- Bottom Console Status Ribbon -->
  <g transform="translate(10, 430)" fill="rgba(255, 255, 255, 0.4)" font-size="9">
    <text x="25" y="0">SYS.PROT: MULTIVERSE_TRAVERSAL_OK</text>
    <text x="350" y="0" text-anchor="middle" fill="#00F0FF" class="glitch glow-cyan">🕷️ CONSTELLATION WEB MAPPED // DYNAMIC_GRAVITY_LOCK</text>
    <text x="655" y="0" text-anchor="end">LOC // SECTOR_800</text>
  </g>
</svg>
