<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Outfit:wght@300;400;700&amp;display=swap');
      
      svg {
        background-color: #0F0E17;
        font-family: 'Fira Code', monospace;
      }
      
      /* Glowing styles */
      .glow-pink {
        filter: drop-shadow(0 0 6px #FF8E9F);
      }
      .glow-orange {
        filter: drop-shadow(0 0 6px #FFAD60);
      }
      .glow-yellow {
        filter: drop-shadow(0 0 8px #FFEEAD);
      }
      
      /* --- ANIMATION KEYFRAMES --- */
      
      /* Cloud Drift */
      @keyframes cloud-move {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(400px); }
      }
      .cloud-s1 {
        animation: cloud-move 45s linear infinite;
      }
      .cloud-s2 {
        animation: cloud-move 65s linear infinite;
        animation-delay: -20s;
      }
      
      /* Steam Rising from Coffee */
      @keyframes steam-rise {
        0% { transform: translateY(0px) translateX(0px) scaleX(1); opacity: 0; }
        15% { opacity: 0.5; }
        50% { transform: translateY(-12px) translateX(3px) scaleX(1.3); opacity: 0.7; }
        85% { opacity: 0.3; }
        100% { transform: translateY(-28px) translateX(-2px) scaleX(0.8); opacity: 0; }
      }
      .steam {
        fill: none;
        stroke: #FFEEAD;
        stroke-width: 1.5;
        stroke-linecap: round;
        animation: steam-rise 4s ease-in-out infinite;
      }
      .st1 { animation-delay: 0s; }
      .st2 { animation-delay: 1.3s; }
      .st3 { animation-delay: 2.6s; }
      
      /* Cat Breathing */
      @keyframes cat-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.06); }
      }
      .cat-sleeping {
        transform-origin: 250px 318px;
        animation: cat-breathe 4s ease-in-out infinite;
      }
      
      /* Cassette Spindle Spin */
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spindle {
        transform-box: fill-box;
        animation: spin 5s linear infinite;
      }
      .spindle-left {
        transform-origin: 550px 145px;
      }
      .spindle-right {
        transform-origin: 670px 145px;
      }
      
      /* Music Equalizer Visualizer */
      @keyframes visualizer-pulse {
        0% { transform: scaleY(0.25); }
        100% { transform: scaleY(1.2); }
      }
      .eq-bar {
        fill: #FF8E9F;
        transform-origin: bottom;
        animation: visualizer-pulse 0.7s ease-in-out infinite alternate;
      }
      .eq-yellow { fill: #FFEEAD; }
      .eq-orange { fill: #FFAD60; }
      
      /* Staggered Eq Delay */
      .e1 { animation-delay: 0.1s; }
      .e2 { animation-delay: 0.4s; }
      .e3 { animation-delay: 0.2s; }
      .e4 { animation-delay: 0.6s; }
      .e5 { animation-delay: 0.3s; }
      .e6 { animation-delay: 0.5s; }
      .e7 { animation-delay: 0.7s; }
      .e8 { animation-delay: 0.2s; }
      .e9 { animation-delay: 0.4s; }
      .e10 { animation-delay: 0.1s; }
      
      /* Media Progress Bar Fill Loop (15s) */
      @keyframes progress-fill {
        0% { width: 10px; }
        100% { width: 220px; }
      }
      .progress-fill-bar {
        animation: progress-fill 15s linear infinite;
      }
      
      @keyframes handle-move {
        0% { transform: translateX(0px); }
        100% { transform: translateX(210px); }
      }
      .progress-handle {
        animation: handle-move 15s linear infinite;
      }
      
      /* Flashing Play Button */
      @keyframes indicator-flash {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .indicator-live {
        animation: indicator-flash 2s infinite;
      }
      
      /* Stars Blinking */
      @keyframes star-blink {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .star {
        fill: #FFEEAD;
        animation: star-blink 3s infinite alternate;
      }
      .st-d1 { animation-delay: 0s; }
      .st-d2 { animation-delay: 1s; }
      .st-d3 { animation-delay: 2s; }
    </style>

    <!-- Gradients -->
    <linearGradient id="lofi-sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B3B60" />
      <stop offset="45%" stop-color="#9C5B7A" />
      <stop offset="80%" stop-color="#C06C84" />
      <stop offset="100%" stop-color="#F8B195" />
    </linearGradient>
    
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(248, 177, 149, 0.15)" />
      <stop offset="100%" stop-color="rgba(75, 59, 96, 0)" />
    </linearGradient>

    <linearGradient id="lamp-cone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 238, 173, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 238, 173, 0.0)" />
    </linearGradient>

    <!-- Window Clip Path -->
    <clipPath id="window-clip">
      <rect x="50" y="50" width="370" height="210" rx="8" />
    </clipPath>
  </defs>

  <!-- ==================== LEFT AREA: COZY ROOM STUDY ==================== -->

  <!-- Cozy Sky Window -->
  <g>
    <!-- Background Horizon Gradient -->
    <rect x="50" y="50" width="370" height="210" rx="8" fill="url(#lofi-sunset)" />
    
    <!-- Stars (Blinking) -->
    <circle cx="90" cy="80" r="1" class="star st-d1" />
    <circle cx="160" cy="65" r="1.5" class="star st-d3" />
    <circle cx="280" cy="90" r="1" class="star st-d2" />
    <circle cx="340" cy="75" r="1.5" class="star st-d1" />
    <circle cx="210" cy="110" r="0.8" class="star st-d2" />
    <circle cx="390" cy="100" r="1" class="star st-d3" />

    <!-- Crescent Moon -->
    <path d="M 330,70 A 18,18 0 1,0 305,95 A 14,14 0 1,1 330,70 Z" fill="#FFEEAD" class="glow-yellow" />

    <!-- Drifting Pastel Clouds -->
    <g clip-path="url(#window-clip)" opacity="0.35">
      <!-- Cloud Group 1 -->
      <g class="cloud-s1">
        <path d="M 50,150 Q 70,130 90,150 Q 110,130 130,150 Q 140,150 145,155 Q 155,165 140,175 H 40 Z" fill="#F8B195" />
      </g>
      <!-- Cloud Group 2 -->
      <g class="cloud-s2">
        <path d="M 180,110 Q 200,90 220,110 Q 240,90 260,110 Q 275,110 280,120 Q 290,135 270,145 H 170 Z" fill="#C06C84" />
      </g>
    </g>

    <!-- City Skyline Silhouette inside window -->
    <g clip-path="url(#window-clip)" fill="#2C243B" opacity="0.9">
      <!-- Distant Buildings -->
      <rect x="50" y="210" width="40" height="50" />
      <rect x="110" y="195" width="35" height="65" />
      <rect x="175" y="215" width="45" height="45" />
      <rect x="235" y="180" width="30" height="80" />
      <rect x="280" y="200" width="50" height="60" />
      <rect x="350" y="220" width="50" height="40" />
      
      <!-- Power Lines/Towers -->
      <line x1="50" y1="240" x2="420" y2="240" stroke="#1D1627" stroke-width="0.8" />
    </g>

    <!-- Cozy Window Windowpane Grid -->
    <rect x="50" y="50" width="370" height="210" rx="8" fill="none" stroke="#181524" stroke-width="6" />
    <line x1="235" y1="50" x2="235" y2="260" stroke="#181524" stroke-width="5" />
    <line x1="50" y1="155" x2="420" y2="155" stroke="#181524" stroke-width="5" />
  </g>

  <!-- Ambient Light Reflection on wall from window -->
  <rect x="30" y="40" width="410" height="320" rx="10" fill="url(#window-glow)" pointer-events="none" />

  <!-- The Desk Surface -->
  <rect x="30" y="280" width="410" height="80" rx="4" fill="#201C2B" stroke="#13101C" stroke-width="1.5" />
  
  <!-- Desk Accessories -->
  <!-- 1. The Retro Desk Lamp -->
  <g>
    <!-- Stand -->
    <path d="M 385,280 C 385,240 370,225 350,225" fill="none" stroke="#2D273E" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 380,280 H 390" stroke="#1A1526" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Head -->
    <path d="M 342,215 L 360,227 L 345,245 L 328,232 Z" fill="#FFAD60" class="glow-orange" />
    <!-- Light Cone Projection -->
    <polygon points="344,239 270,360 410,360" fill="url(#lamp-cone)" />
  </g>

  <!-- 2. Laptop (Open, screen glowing with terminal text simulation) -->
  <g>
    <!-- Laptop screen back -->
    <path d="M 70,295 L 75,245 L 140,245 L 145,295 Z" fill="#13101C" stroke="#2D273E" stroke-width="1" />
    <!-- Screen Face (Glowing green matrix text) -->
    <polygon points="76,290 80,250 135,250 139,290" fill="#0A0B10" />
    <!-- Code line simulations inside screen -->
    <line x1="85" y1="257" x2="110" y2="257" stroke="#9C5B7A" stroke-width="1.5" />
    <line x1="85" y1="264" x2="125" y2="264" stroke="#FFEEAD" stroke-width="1.5" />
    <line x1="92" y1="271" x2="115" y2="271" stroke="#FF8E9F" stroke-width="1.5" />
    <line x1="85" y1="278" x2="120" y2="278" stroke="#FFAD60" stroke-width="1.5" />
    <circle cx="85" cy="285" r="1.5" fill="#FFEEAD" />
    <!-- Laptop Base -->
    <path d="M 60,295 H 155 L 160,302 H 55 Z" fill="#2D273E" stroke="#13101C" stroke-width="1.2" />
  </g>

  <!-- 3. Cozy Coffee Mug with rises of Steam -->
  <g>
    <!-- Steam lines -->
    <path d="M 175,273 Q 172,263 178,253 T 175,238" class="steam st1" />
    <path d="M 181,273 Q 178,263 184,253 T 181,238" class="steam st2" />
    <path d="M 187,273 Q 184,263 190,253 T 187,238" class="steam st3" />
    <!-- Mug Body -->
    <rect x="170" y="278" width="22" height="22" rx="4" fill="#C06C84" stroke="#1A1526" stroke-width="1" />
    <!-- Mug Handle -->
    <path d="M 192,282 H 197 V 292 H 192" fill="none" stroke="#C06C84" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- 4. Curled-up Sleeping Cat (Breathing) -->
  <g class="cat-sleeping">
    <!-- Cat body -->
    <ellipse cx="250" cy="302" rx="19" ry="13" fill="#FFAD60" stroke="#13101C" stroke-width="1" />
    <!-- Cat head -->
    <circle cx="236" cy="295" r="9" fill="#FFAD60" stroke="#13101C" stroke-width="1" />
    <!-- Cat ears -->
    <polygon points="230,287 232,280 236,287" fill="#FFAD60" />
    <polygon points="240,287 242,280 244,287" fill="#FFAD60" />
    <!-- Cat tail tucked -->
    <path d="M 268,306 C 268,300 258,295 258,295" fill="none" stroke="#FFAD60" stroke-width="3.5" stroke-linecap="round" />
    <!-- Closed eyes -->
    <path d="M 230,296 Q 233,299 236,296" fill="none" stroke="#8A4A32" stroke-width="0.8" />
  </g>

  <!-- 5. Small Potted Succulent Plant -->
  <g>
    <!-- Pot -->
    <polygon points="310,298 322,298 320,314 312,314" fill="#9C5B7A" stroke="#13101C" stroke-width="1" />
    <!-- Plant Leaves -->
    <path d="M 316,298 Q 312,286 308,292 Q 316,294 316,298 Z" fill="#FFEEAD" />
    <path d="M 316,298 Q 320,286 324,292 Q 316,294 316,298 Z" fill="#FFAD60" />
    <path d="M 316,298 Q 316,282 316,290" fill="none" stroke="#FFEEAD" stroke-width="2.5" stroke-linecap="round" />
  </g>


  <!-- ==================== RIGHT AREA: LOFI CASSETTE PLAYER ==================== -->

  <!-- Main Player Chassis -->
  <rect x="470" y="50" width="280" height="310" rx="12" fill="#181722" stroke="#252335" stroke-width="2" />
  <!-- Inner Bezel -->
  <rect x="482" y="62" width="256" height="286" rx="8" fill="#111019" />

  <!-- Flashing Player Indicator Light -->
  <g>
    <circle cx="505" cy="85" r="4" fill="#FF8E9F" class="indicator-live glow-pink" />
    <text x="515" y="89" fill="#FF8E9F" font-size="8" font-weight="700" letter-spacing="1">PLAYING</text>
  </g>

  <!-- CASSETTE TAPE CONTAINER -->
  <g>
    <!-- Cassette Window Bezel -->
    <rect x="502" y="105" width="216" height="110" rx="6" fill="#1A1826" stroke="#2D2B3D" stroke-width="1.5" />
    <!-- Clear Cassette Glass Body -->
    <rect x="510" y="112" width="200" height="96" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    
    <!-- Spindle Hubs (Reels) -->
    <!-- Left Spindle -->
    <circle cx="550" cy="145" r="24" fill="#111019" stroke="#FFAD60" stroke-width="1.5" class="glow-orange" />
    <g class="spindle spindle-left">
      <!-- Center Spokes (Spindle details) -->
      <line x1="550" y1="129" x2="550" y2="161" stroke="#FFAD60" stroke-width="2.5" />
      <line x1="534" y1="145" x2="566" y2="145" stroke="#FFAD60" stroke-width="2.5" />
      <circle cx="550" cy="145" r="14" fill="#111019" />
      <circle cx="550" cy="145" r="7" fill="#FFEEAD" />
    </g>

    <!-- Right Spindle -->
    <circle cx="670" cy="145" r="24" fill="#111019" stroke="#FFAD60" stroke-width="1.5" class="glow-orange" />
    <g class="spindle spindle-right">
      <!-- Center Spokes -->
      <line x1="670" y1="129" x2="670" y2="161" stroke="#FFAD60" stroke-width="2.5" />
      <line x1="654" y1="145" x2="686" y2="145" stroke="#FFAD60" stroke-width="2.5" />
      <circle cx="670" cy="145" r="14" fill="#111019" />
      <circle cx="670" cy="145" r="7" fill="#FFEEAD" />
    </g>

    <!-- Cassette Center Tape Label Detail -->
    <rect x="584" y="135" width="52" height="20" rx="2" fill="#252335" />
    <text x="610" y="148" fill="#FF8E9F" font-size="9" text-anchor="middle" font-weight="700">TDK 60</text>
  </g>

  <!-- AUDIO TEXT METRICS -->
  <g fill="#FFEEAD" font-size="9">
    <text x="502" y="243">track  // lofi_beats_to_code.wav</text>
    <text x="502" y="258">stream // 128 kbps / 44.1 khz</text>
  </g>

  <!-- PULSING EQUALIZER WAVE (Radiating at the bottom) -->
  <g transform="translate(502, 292)">
    <!-- Base track line -->
    <line x1="0" y1="0" x2="216" y2="0" stroke="#252335" stroke-width="1" />
    
    <!-- 10 visualizer bars (spacing 8px, width 4px) -->
    <rect x="5" y="-12" width="4" height="12" class="eq-bar e1" />
    <rect x="17" y="-12" width="4" height="12" class="eq-bar eq-yellow e3" />
    <rect x="29" y="-12" width="4" height="12" class="eq-bar eq-orange e5" />
    <rect x="41" y="-12" width="4" height="12" class="eq-bar e7" />
    <rect x="53" y="-12" width="4" height="12" class="eq-bar eq-yellow e9" />
    <rect x="65" y="-12" width="4" height="12" class="eq-bar eq-orange e10" />
    <rect x="77" y="-12" width="4" height="12" class="eq-bar e8" />
    <rect x="89" y="-12" width="4" height="12" class="eq-bar eq-yellow e6" />
    <rect x="101" y="-12" width="4" height="12" class="eq-bar eq-orange e4" />
    <rect x="113" y="-12" width="4" height="12" class="eq-bar e2" />
    <rect x="125" y="-12" width="4" height="12" class="eq-bar eq-yellow e1" />
    <rect x="137" y="-12" width="4" height="12" class="eq-bar eq-orange e3" />
    <rect x="149" y="-12" width="4" height="12" class="eq-bar e5" />
    <rect x="161" y="-12" width="4" height="12" class="eq-bar eq-yellow e7" />
    <rect x="173" y="-12" width="4" height="12" class="eq-bar eq-orange e9" />
    <rect x="185" y="-12" width="4" height="12" class="eq-bar e10" />
    <rect x="197" y="-12" width="4" height="12" class="eq-bar eq-yellow e8" />
    <rect x="209" y="-12" width="4" height="12" class="eq-bar eq-orange e6" />
  </g>

  <!-- MEDIA LOOP PROGRESS BAR -->
  <g transform="translate(502, 315)">
    <!-- Rail -->
    <rect x="0" y="0" width="216" height="4" rx="2" fill="#252335" />
    <!-- Fill (Looping animation) -->
    <rect x="0" y="0" width="10" height="4" rx="2" fill="#FF8E9F" class="progress-fill-bar glow-pink" />
    <!-- Handle (Looping animation synced) -->
    <circle cx="5" cy="2" r="4.5" fill="#FFFFFF" class="progress-handle glow-pink" />
    
    <!-- Time indicator text -->
    <text x="0" y="20" fill="rgba(255,255,255,0.4)" font-size="8">02:34</text>
    <text x="216" y="20" fill="rgba(255,255,255,0.4)" font-size="8" text-anchor="end">03:50</text>
  </g>
</svg>
