<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D GLB Animation to GIF Recorder</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  
  <!-- Model Viewer CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  
  <!-- Gifshot CDN (Client-side GIF compiler) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

  <style>
    :root {
      --bg-dark: #080A0F;
      --bg-panel: #111420;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --text-light: #cbd5e1;
      --border: rgba(0, 240, 255, 0.15);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    
    h1 span {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    
    p.subtitle {
      font-size: 1rem;
      color: #64748b;
      font-family: 'Fira Code', monospace;
    }
    
    .recorder-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      width: 100%;
      max-width: 1100px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    
    .viewer-container {
      position: relative;
      background-color: #0c0e16;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      border-right: 1px solid var(--border);
    }
    
    /* Background presets */
    .bg-sunset {
      background: linear-gradient(135deg, #4B3B60, #C06C84, #F8B195);
    }
    .bg-cyber {
      background: linear-gradient(135deg, #090B15, #1B0F2A, #061A2B);
    }
    .bg-transparent {
      background-color: transparent !important;
      background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0);
      background-size: 24px 24px;
    }
    
    model-viewer {
      width: 100%;
      height: 450px;
      border-radius: 12px;
    }
    
    .controls-container {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .control-group {
      margin-bottom: 1.8rem;
    }
    
    label {
      display: block;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }
    
    select, input[type="text"] {
      width: 100%;
      background-color: #080A0F;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s;
    }
    
    select:focus, input[type="text"]:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }
    
    .preset-buttons {
      display: flex;
      gap: 10px;
    }
    
    .btn-preset {
      flex-grow: 1;
      padding: 8px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      background-color: #080A0F;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-preset.active {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      background-color: rgba(0, 240, 255, 0.05);
    }
    
    .btn-record {
      width: 100%;
      background-color: var(--neon-pink);
      color: #fff;
      border: none;
      padding: 1.1rem;
      font-family: 'Fira Code', monospace;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .btn-record:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
      background-color: #ff2295;
    }
    
    .btn-record:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    .progress-wrapper {
      margin-top: 1.5rem;
      display: none;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: #080A0F;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    
    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      transition: width 0.1s ease;
    }
    
    .progress-text {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      text-align: center;
    }
    
    footer {
      margin-top: 3rem;
      text-align: center;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <header>
    <h1>3D ROBOT // <span>GIF GENERATOR</span></h1>
    <p class="subtitle">Render your .glb model locally &amp; record it to a Profile GIF</p>
  </header>

  <div class="recorder-grid">
    <!-- 3D WebGL Viewport -->
    <div class="viewer-container bg-cyber" id="viewport">
      <model-viewer id="robotViewer"
                    src="robot_playground.glb"
                    autoplay
                    animation-name="RobotAnimation"
                    camera-controls
                    shadow-intensity="1.5"
                    interaction-prompt="none"
                    camera-orbit="0deg 75deg 105%"
                    auto-rotate-delay="0"
                    field-of-view="30deg">
      </model-viewer>
    </div>
    
    <!-- Controls Dashboard -->
    <div class="controls-container">
      <div>
        <div class="control-group">
          <label>Backdrop Theme</label>
          <div class="preset-buttons">
            <button class="btn-preset active" onclick="setBg('cyber', this)">Cyber Dark</button>
            <button class="btn-preset" onclick="setBg('sunset', this)">Lofi Sunset</button>
            <button class="btn-preset" onclick="setBg('transparent', this)">Transparent</button>
          </div>
        </div>

        <div class="control-group">
          <label>Auto-Orbit Rotation</label>
          <select id="orbitSelect" onchange="toggleOrbit(this.value)">
            <option value="none">No Rotation (Static View)</option>
            <option value="slow">Slow Horizontal Orbit</option>
            <option value="fast">Fast Horizontal Orbit</option>
          </select>
        </div>

        <div class="control-group">
          <label>Quality &amp; Sizing</label>
          <select id="sizeSelect">
            <option value="450">450 x 450 px (Recommended)</option>
            <option value="350">350 x 350 px (Lightweight)</option>
            <option value="550">550 x 550 px (High Res)</option>
          </select>
        </div>
      </div>
      
      <div>
        <button class="btn-record" id="recordBtn" onclick="startRecording()">⏺️ RECORD &amp; COMPILE GIF</button>
        
        <div class="progress-wrapper" id="progressWrapper">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">Initializing WebGL Buffer...</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Render utility built with Three.js &amp; Google Model-Viewer</p>
  </footer>

  <script>
    const modelViewer = document.getElementById('robotViewer');
    const viewport = document.getElementById('viewport');
    
    // Background picker
    function setBg(preset, btn) {
      // remove classes
      viewport.className = 'viewer-container';
      viewport.classList.add('bg-' + preset);
      
      // update buttons
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    
    // Orbit Toggle
    function toggleOrbit(mode) {
      if (mode === 'slow') {
        modelViewer.autoRotate = true;
        modelViewer.setAttribute('auto-rotate', '');
        // Slow orbit speed (deg per frame, default is 9deg/sec at 60fps)
        modelViewer.style.setProperty('--mv-auto-rotate-speed', '2deg');
      } else if (mode === 'fast') {
        modelViewer.autoRotate = true;
        modelViewer.setAttribute('auto-rotate', '');
        modelViewer.style.setProperty('--mv-auto-rotate-speed', '6deg');
      } else {
        modelViewer.autoRotate = false;
        modelViewer.removeAttribute('auto-rotate');
      }
    }
    
    // Recording Logic
    async function startRecording() {
      const recordBtn = document.getElementById('recordBtn');
      const progressWrapper = document.getElementById('progressWrapper');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const size = parseInt(document.getElementById('sizeSelect').value);
      
      recordBtn.disabled = true;
      progressWrapper.style.display = 'block';
      progressFill.style.width = '0%';
      progressText.innerText = 'Capturing frame buffers... (0%)';
      
      const frames = [];
      const totalFrames = 40; // 40 frames at 15fps is approx 2.6 seconds loop
      const frameDelay = 180; // 180ms delay between captures
      
      // Wait for model-viewer WebGL canvas to settle
      await new Promise(resolve => setTimeout(resolve, 800));
      
      for (let i = 0; i < totalFrames; i++) {
        progressText.innerText = `Capturing frame buffer... (${Math.round((i / totalFrames) * 100)}%)`;
        progressFill.style.width = `${(i / totalFrames) * 100}%`;
        
        // Grab WebGL frame
        const dataUrl = modelViewer.toDataURL('image/png');
        frames.push(dataUrl);
        
        await new Promise(resolve => setTimeout(resolve, frameDelay));
      }
      
      progressText.innerText = 'Compiling visual buffers into optimized GIF...';
      progressFill.style.width = '100%';
      
      // Compile using gifshot.js CDN
      gifshot.createGIF({
        images: frames,
        gifWidth: size,
        gifHeight: size,
        interval: 0.15, // frame delay in seconds
        numWorkers: 2,
        keepAspectRatio: true
      }, function (obj) {
        if (!obj.error) {
          const downloadLink = document.createElement('a');
          downloadLink.download = 'robot_playground.gif';
          downloadLink.href = obj.image;
          downloadLink.click();
          
          progressText.innerText = '✅ Recording complete! Download triggered.';
          recordBtn.disabled = false;
        } else {
          progressText.innerText = '❌ Error compiling GIF: ' + obj.error;
          recordBtn.disabled = false;
        }
      });
    }
  </script>

</body>
</html>
