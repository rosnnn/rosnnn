<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 60" width="500" height="60">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
    .title-text {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: 2px;
    }
  </style>
  <defs>
    <clipPath id="typing-clip">
      <rect x="0" y="0" height="60" width="0">
        <animate 
          attributeName="width" 
          values="0; 0; 500; 500; 0; 0" 
          keyTimes="0; 0.05; 0.55; 0.80; 0.92; 1" 
          dur="10s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>
  
  <text x="50%" y="42" text-anchor="middle" class="title-text" clip-path="url(#typing-clip)">ROSHAN KUMAR JHA</text>
</svg>
