<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" width="320" height="50">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
    .title-text {
      font-family: 'Fira Code', monospace;
      font-size: 24px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .cursor {
      fill: #ff6188;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink {
      from, to { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="typing-clip">
      <rect x="0" y="0" height="50" width="0">
        <animate 
          attributeName="width" 
          values="0; 0; 320; 320; 0; 0" 
          keyTimes="0; 0.05; 0.55; 0.80; 0.92; 1" 
          dur="10s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>
  
  <text x="50%" y="35" text-anchor="middle" class="title-text" clip-path="url(#typing-clip)">ROSHAN KUMAR JHA</text>
  
  <rect class="cursor" y="12" height="24" width="3">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="42 0; 42 0; 278 0; 278 0; 42 0; 42 0" 
      keyTimes="0; 0.05; 0.55; 0.80; 0.92; 1" 
      dur="10s" 
      repeatCount="indefinite" />
  </rect>
</svg>
