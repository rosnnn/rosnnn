<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Fonts and Styling -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Outfit:wght@400;700;900&amp;display=swap');
      
      svg {
        background-color: #05060A;
        font-family: 'Outfit', sans-serif;
      }
      
      /* Neon Glow Effects */
      .neon-cyan {
        filter: drop-shadow(0 0 8px #00F0FF);
      }
      .neon-pink {
        filter: drop-shadow(0 0 8px #FF007F);
      }
      .neon-white {
        filter: drop-shadow(0 0 8px #FFFFFF);
      }
      
      /* Rotations (Mandala/Sri Yantra HUD) */
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      
      .rotate-cw {
        transform-origin: 300px 220px;
        animation: spin-cw 30s linear infinite;
      }
      .rotate-ccw {
        transform-origin: 300px 220px;
        animation: spin-ccw 20s linear infinite;
      }
      
      /* Third Eye Pulsing Scan Rings */
      @keyframes scan-ring-expand {
        0% { r: 5px; opacity: 1; stroke-width: 1.5; }
        50% { opacity: 0.8; }
        100% { r: 75px; opacity: 0; stroke-width: 0.5; }
      }
      .scan-ring-1 {
        transform-origin: 300px 210px;
        animation: scan-ring-expand 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .scan-ring-2 {
        transform-origin: 300px 210px;
        animation: scan-ring-expand 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        animation-delay: 2s;
      }
      
      /* Third Eye Core Pulse */
      @keyframes eye-glow {
        0%, 100% { transform: scaleY(0.9); filter: drop-shadow(0 0 4px #FF007F); }
        50% { transform: scaleY(1.15); filter: drop-shadow(0 0 12px #FF007F); }
      }
      .third-eye-core {
        transform-origin: 300px 210px;
        animation: eye-glow 2s ease-in-out infinite;
      }
      
      /* Floating Cosmic Code Particles */
      @keyframes rise-drift {
        0% { transform: translateY(450px) translateX(0px); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(-50px) translateX(20px); opacity: 0; }
      }
      .cosmic-particle {
        fill: #00F0FF;
        animation: rise-drift 8s linear infinite;
      }
      .cp-pink { fill: #FF007F; }
      .cp-white { fill: #FFFFFF; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 2s; }
      .p3 { animation-delay: 4s; }
      .p4 { animation-delay: 6s; }
      
      /* Damru Equalizer Visualizer */
      @keyframes eq-scale {
        0% { transform: scaleY(0.2); }
        100% { transform: scaleY(1.3); }
      }
      .eq-bar {
        fill: #00F0FF;
        transform-origin: bottom;
        animation: eq-scale 0.8s ease-in-out infinite alternate;
      }
      .eq-pink { fill: #FF007F; }
      .d-eq1 { animation-delay: 0.1s; }
      .d-eq2 { animation-delay: 0.4s; }
      .d-eq3 { animation-delay: 0.2s; }
      .d-eq4 { animation-delay: 0.5s; }
      .d-eq5 { animation-delay: 0.3s; }
      
      /* Trident Breathing Glow */
      @keyframes trishul-pulse {
        0%, 100% { filter: drop-shadow(0 0 5px #00F0FF); opacity: 0.85; }
        50% { filter: drop-shadow(0 0 15px #00F0FF); opacity: 1; }
      }
      .trishul-group {
        animation: trishul-pulse 4s ease-in-out infinite;
      }
      
      /* Circuit Path Flow */
      @keyframes flow {
        from { stroke-dashoffset: 120; }
        to { stroke-dashoffset: 0; }
      }
      .circuit-flow-path {
        stroke-dasharray: 20 60;
        animation: flow 3s linear infinite;
      }
      
      /* Tech Glitch Text */
      @keyframes text-glitch-effect {
        0%, 100% { transform: translate(0); text-shadow: none; }
        94% { transform: translate(1.5px, -1px); text-shadow: -1px 0 #FF007F, 1px 0 #00F0FF; }
        96% { transform: translate(-1.5px, 1px); text-shadow: 1px 0 #FF007F, -1px 0 #00F0FF; }
        98% { transform: translate(0); }
      }
      .glitch-text {
        animation: text-glitch-effect 7s step-end infinite;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="neon-cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="neon-pink-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#9F00FF" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND: Space Matrix Grid -->
  <g stroke="#0E121E" stroke-width="0.8" opacity="0.6">
    <!-- Horizontal -->
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="110" x2="600" y2="110" />
    <line x1="0" y1="170" x2="600" y2="170" />
    <line x1="0" y1="230" x2="600" y2="230" />
    <line x1="0" y1="290" x2="600" y2="290" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="0" y1="410" x2="600" y2="410" />
    <!-- Vertical -->
    <line x1="75" y1="0" x2="75" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="225" y1="0" x2="225" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="375" y1="0" x2="375" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="525" y1="0" x2="525" y2="450" />
  </g>

  <!-- BACKGROUND: Floating Cosmic Star Particles -->
  <circle cx="50" cy="0" r="1.5" class="cosmic-particle p1" />
  <circle cx="120" cy="0" r="2.5" class="cosmic-particle cp-pink p3" />
  <circle cx="210" cy="0" r="1.5" class="cosmic-particle cp-white p2" />
  <circle cx="390" cy="0" r="2" class="cosmic-particle p4" />
  <circle cx="480" cy="0" r="1" class="cosmic-particle cp-pink p1" />
  <circle cx="540" cy="0" r="3" class="cosmic-particle cp-white p3" />
  <circle cx="160" cy="0" r="2" class="cosmic-particle p4" />
  <circle cx="430" cy="0" r="1.5" class="cosmic-particle cp-white p2" />

  <!-- DEEP BACKGROUND: Sacred Geometry Sri Yantra HUD Circles -->
  <g opacity="0.22">
    <!-- Sri Yantra Outer Ring (CW) -->
    <circle cx="300" cy="220" r="170" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="10 15 2 8" class="rotate-cw" />
    <circle cx="300" cy="220" r="162" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4 2" class="rotate-cw" />
    
    <!-- Sri Yantra Intersecting Triangle Mandala (CCW) -->
    <g class="rotate-ccw" stroke="#FF007F" stroke-width="1.2" fill="none">
      <!-- Triangle 1 (Pointing Up) -->
      <polygon points="300,75 170,290 430,290" />
      <!-- Triangle 2 (Pointing Down) -->
      <polygon points="300,365 170,150 430,150" />
      <!-- Inner smaller triangles -->
      <polygon points="300,115 205,270 395,270" stroke="#00F0FF" />
      <polygon points="300,325 205,170 395,170" stroke="#00F0FF" />
      <polygon points="300,155 240,250 360,250" />
      <polygon points="300,285 240,190 360,190" />
    </g>
    
    <!-- Outer Core Tick Circle -->
    <circle cx="300" cy="220" r="130" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="35 15" class="rotate-cw" />
  </g>

  <!-- THIRD EYE PULSING SCAN RINGS -->
  <circle cx="300" cy="210" r="5" fill="none" stroke="#FF007F" class="scan-ring-1 neon-pink" />
  <circle cx="300" cy="210" r="5" fill="none" stroke="#FF007F" class="scan-ring-2 neon-pink" />

  <!-- THE TRISHUL (Trident) - Main Centerpiece -->
  <g class="trishul-group">
    <!-- Trishul Shaft (Metallic Blue-Cyan Glow) -->
    <line x1="300" y1="180" x2="300" y2="400" stroke="url(#neon-cyan-gradient)" stroke-width="4.5" stroke-linecap="round" class="neon-cyan" />
    <line x1="300" y1="180" x2="300" y2="400" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    
    <!-- Left Prong Geometric Outline -->
    <path d="M 300,180 Q 220,180 220,115 L 214,115 L 220,95 L 226,115 L 220,115 Q 220,170 300,170 Z" fill="url(#neon-cyan-gradient)" stroke="#00F0FF" stroke-width="1.5" class="neon-cyan" />
    <!-- Left Prong Inner Energy Circuit Line -->
    <path d="M 290,173 Q 225,173 225,120" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
    
    <!-- Right Prong Geometric Outline -->
    <path d="M 300,180 Q 380,180 380,115 L 374,115 L 380,95 L 386,115 L 380,115 Q 380,170 300,170 Z" fill="url(#neon-cyan-gradient)" stroke="#00F0FF" stroke-width="1.5" class="neon-cyan" />
    <!-- Right Prong Inner Energy Circuit Line -->
    <path d="M 310,173 Q 375,173 375,120" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />

    <!-- Center Sharp Spear Head -->
    <path d="M 300,170 L 300,75 L 293,82 L 300,60 L 307,82 L 300,75 Z" fill="url(#neon-cyan-gradient)" stroke="#00F0FF" stroke-width="2" class="neon-cyan" />
    <line x1="300" y1="80" x2="300" y2="165" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />

    <!-- Trishul Decorative Ribs (Lower Crossbar) -->
    <path d="M 280,192 H 320" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" class="neon-cyan" />
    <path d="M 285,200 H 315" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- DIGITAL CRESCENT MOON (Tech gauge style, top-right prong) -->
  <g class="neon-white">
    <!-- Inner crescent fill -->
    <path d="M 390,75 A 25,25 0 1,0 355,110 A 19,19 0 1,1 390,75 Z" fill="url(#neon-cyan-gradient)" opacity="0.3" />
    <!-- Segmented Outer Outline -->
    <path d="M 390,75 A 25,25 0 1,0 355,110" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 5 12 4" />
    <!-- Tech Dot connection -->
    <circle cx="355" cy="110" r="3" fill="#00F0FF" class="neon-cyan" />
  </g>

  <!-- HOLOGRAPHIC VERTICAL THIRD EYE -->
  <g class="third-eye-core">
    <!-- Third Eye Border Outline -->
    <path d="M 300,195 C 286,210 286,218 300,225 C 314,218 314,210 300,195 Z" fill="#110515" stroke="#FF007F" stroke-width="2" class="neon-pink" />
    <!-- Vertical Laser Slit Pupil -->
    <line x1="300" y1="199" x2="300" y2="221" stroke="#FF007F" stroke-width="3" stroke-linecap="round" class="neon-pink" />
    <line x1="300" y1="202" x2="300" y2="218" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- DAMRU (Cosmic Drum / Hourglass sub-woofer) -->
  <g>
    <!-- Damru Body Shell (Two triangles crossing) -->
    <path d="M 276,270 L 324,270 L 300,295 L 324,320 L 276,320 L 300,295 Z" fill="#0E121E" stroke="#00F0FF" stroke-width="2" class="neon-cyan" />
    <path d="M 283,276 H 317 V 279 H 283 Z M 283,311 H 317 V 314 H 283 Z" fill="#FF007F" class="neon-pink" opacity="0.6" />
    
    <!-- Central Tied Leather Thread bands -->
    <rect x="294" y="291" width="12" height="8" fill="#1C233A" stroke="#00F0FF" stroke-width="1" />
    <line x1="294" y1="295" x2="306" y2="295" stroke="#FF007F" stroke-width="1.2" />

    <!-- Hanging Beads (Suspended on threads) -->
    <!-- Left string and bead -->
    <line x1="295" y1="295" x2="278" y2="306" stroke="#00F0FF" stroke-width="1" />
    <circle cx="278" cy="306" r="3" fill="#FF007F" class="neon-pink" />
    <!-- Right string and bead -->
    <line x1="305" y1="295" x2="322" y2="306" stroke="#00F0FF" stroke-width="1" />
    <circle cx="322" cy="306" r="3" fill="#FF007F" class="neon-pink" />
  </g>

  <!-- AUDIO VISUALIZER BARS (Radiating from Damru sides) -->
  <!-- Left Side Visualizer (Pulsing outwards) -->
  <g transform="translate(265, 295) rotate(-90)">
    <!-- Base center -->
    <rect x="-10" y="5" width="3" height="15" class="eq-bar d-eq1" />
    <rect x="-5" y="5" width="3" height="24" class="eq-bar eq-pink d-eq3" />
    <rect x="0" y="5" width="3" height="32" class="eq-bar d-eq5" />
    <rect x="5" y="5" width="3" height="20" class="eq-bar eq-pink d-eq2" />
    <rect x="10" y="5" width="3" height="12" class="eq-bar d-eq4" />
  </g>
  <!-- Right Side Visualizer (Pulsing outwards) -->
  <g transform="translate(335, 295) rotate(90)">
    <rect x="-10" y="5" width="3" height="15" class="eq-bar d-eq2" />
    <rect x="-5" y="5" width="3" height="28" class="eq-bar eq-pink d-eq4" />
    <rect x="0" y="5" width="3" height="34" class="eq-bar d-eq5" />
    <rect x="5" y="5" width="3" height="22" class="eq-bar eq-pink d-eq1" />
    <rect x="10" y="5" width="3" height="14" class="eq-bar d-eq3" />
  </g>

  <!-- CIRCUIT TRACKS ON SHAFT (Data flow pulse) -->
  <path d="M 300,180 V 400" fill="none" stroke="#FF007F" stroke-width="3" class="circuit-flow-path neon-pink" />
  <path d="M 300,180 V 400" fill="none" stroke="#FFFFFF" stroke-width="3" class="circuit-flow-path" style="animation-delay: 1.5s;" />

  <!-- LEFT TELEMETRY PANEL (Sanskrit Monospace & Diagnostics) -->
  <g fill="#00F0FF" font-family="'Fira Code', monospace" font-size="8" opacity="0.8">
    <!-- Sanskrit Glitch Mantra -->
    <text x="25" y="45" class="glitch-text" font-weight="700">ॐ नमः शिवाय</text>
    <text x="25" y="60">SYS_FREQUENCY // 963 HZ</text>
    <text x="25" y="72">TANDAV_ENGINE // ACTIVE</text>
    <rect x="25" y="80" width="70" height="1.5" fill="#00F0FF" class="neon-cyan" />
    
    <!-- Tech metrics bars -->
    <text x="25" y="380">CONSCIOUSNESS // OVERFLOW</text>
    <text x="25" y="392">EGO_STATE // NULL</text>
    <text x="25" y="404">ADIYOGI_KERNEL // ON</text>
  </g>

  <!-- RIGHT TELEMETRY PANEL (Quantum Metrics) -->
  <g fill="#FF007F" font-family="'Fira Code', monospace" font-size="8" text-anchor="end" opacity="0.8">
    <text x="575" y="45" class="glitch-text" font-weight="700">SHIVA_CORE_V9.0</text>
    <text x="575" y="60">SYS.MEDITATION // CLOUD</text>
    <text x="575" y="72">THIRD_EYE // SCANNING</text>
    <rect x="505" y="80" width="70" height="1.5" fill="#FF007F" class="neon-pink" />
    
    <!-- System parameters -->
    <text x="575" y="380">QUANTUM_DECAY // 0.00%</text>
    <text x="575" y="392">COSMIC_DENSITY // 100%</text>
    <text x="575" y="404">DIMENSION // MULTIVERSE</text>
  </g>

  <!-- BOTTOM STATUS READOUT -->
  <g transform="translate(10, 430)" fill="rgba(255, 255, 255, 0.4)" font-size="9">
    <text x="20" y="0">SYS.STATUS: SUPREME_BLISS</text>
    <text x="300" y="0" text-anchor="middle" fill="#00F0FF" class="glitch-text">📿 TRISHUL SIGNAL: ENGAGED // QUANTUM_GRID_LOCK</text>
    <text x="560" y="0" text-anchor="end">LOC: KAILASH_CLOUD</text>
  </g>
</svg>
